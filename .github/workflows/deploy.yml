name: Deploy

on:
  push:
    branches: [Ben, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 4a06488424bef2c5d7b313ba21b3530f

jobs:
  deploy-pages:
    name: 部署主站 (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 建置(含型別檢查)
        run: npm run build

      # 不用 wrangler-action@v3:GitHub 已停用該 action 的 Node 20 runtime。
      # Pages Function 發布偶發 Unknown internal error,失敗就重試。
      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          attempt=1
          max=3
          until npx wrangler pages deploy dist --project-name=go-marketing-center --branch=Ben --commit-dirty=true; do
            if [ "$attempt" -ge "$max" ]; then
              echo "Pages 部署連續失敗 ${max} 次"
              exit 1
            fi
            echo "Cloudflare 暫時失敗,20 秒後重試 (${attempt}/${max})"
            attempt=$((attempt + 1))
            sleep 20
          done

  deploy-scheduler:
    name: 部署排程 Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 型別檢查
        run: npx tsc --noEmit -p workers/scheduler/tsconfig.json

      - name: 部署 Worker
        working-directory: workers/scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

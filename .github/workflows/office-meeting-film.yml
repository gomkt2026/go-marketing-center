name: 晨會影片

# 排程只在預設分支 main 上會跑。這一支會去 Ben 拿腳本與畫片程式。
# 畫完放進 R2，不建立發文排程。
on:
  schedule:
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: 把這一班畫成直式影片
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Ben

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝繪圖工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil fonts-noto-cjk

      - name: 畫還沒完成的晨會
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4a06488424bef2c5d7b313ba21b3530f
        run: bash scripts/render-pending-office-films.sh

<meta property="og:description" content="匠管做 TaskGo、Homigo、Washgo。翻頁看每一套解決什麼問題、客戶可以做哪些事。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a bound showcase book on a desk — one paper page at a time, page-turn between chapters, running head + folio like a printed 型錄 */
:root{
  --desk:#E6EAF0; --paper:#FFFFFF; --ink:#17213A; --muted:#5A6478; --line:#DCE1E8; --soft:#F4F6F9;
  --taskgo:#E2680F; --taskgo-ink:#B4500A; --taskgo-tint:#FDEEE2;
  --homigo:#F2B21B; --homigo-ink:#8A6000; --homigo-tint:#FDF4DC;
  --washgo:#2E6BD6; --washgo-ink:#2257B8; --washgo-tint:#E6EEFC;
  --brand:#17213A; --brand-ink:#17213A; --brand-tint:#ECEFF5;
  --like:#E0405A; --plate:#FFFFFF;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0C1017; --paper:#161D29; --ink:#E7ECF4; --muted:#9AA5B8; --line:#2A3446; --soft:#1C2433;
  --taskgo:#F28A3C; --taskgo-ink:#F7A266; --taskgo-tint:#33220F;
  --homigo:#F5C24A; --homigo-ink:#F5C24A; --homigo-tint:#30290F;
  --washgo:#5E8EEB; --washgo-ink:#86AAF2; --washgo-tint:#18264A;
  --brand:#C9D3E6; --brand-ink:#E7ECF4; --brand-tint:#1F2838; --like:#FF6B82; --plate:#F4F6FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0C1017; --paper:#161D29; --ink:#E7ECF4; --muted:#9AA5B8; --line:#2A3446; --soft:#1C2433;
  --taskgo:#F28A3C; --taskgo-ink:#F7A266; --taskgo-tint:#33220F;
  --homigo:#F5C24A; --homigo-ink:#F5C24A; --homigo-tint:#30290F;
  --washgo:#5E8EEB; --washgo-ink:#86AAF2; --washgo-tint:#18264A;
  --brand:#C9D3E6; --brand-ink:#E7ECF4; --brand-tint:#1F2838; --like:#FF6B82; --plate:#F4F6FA; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--desk)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0} ul,ol{margin:0;padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--desk)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--desk);padding-block:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.top .t{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:820px;margin:0 auto 10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
.chip[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-current="page"] .n{color:inherit;opacity:.7}

/* book */
.book{max-width:820px;margin:0 auto;perspective:2000px;padding-bottom:96px}
.page{background:var(--paper);border-radius:6px 16px 16px 6px;box-shadow:inset 10px 0 18px -14px rgba(10,20,40,.35),0 1px 0 var(--line),0 24px 40px -28px rgba(10,20,40,.45);
  border-left:4px solid var(--c,var(--brand));overflow:hidden;transform-origin:left center}
.page.turn-next{animation:turnNext .6s cubic-bezier(.2,.75,.2,1)}
.page.turn-prev{animation:turnPrev .6s cubic-bezier(.2,.75,.2,1)}
@keyframes turnNext{from{transform:rotateY(-80deg);filter:brightness(.8)}to{transform:none;filter:none}}
@keyframes turnPrev{from{transform:rotateY(25deg) translateX(-30px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.page.turn-next,.page.turn-prev{animation:none}}
.run{display:flex;justify-content:space-between;gap:10px;padding:14px 22px 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.inner{padding:18px 22px 26px;display:flex;flex-direction:column;gap:30px}
.folio{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 0 18px}
@media (min-width:640px){.inner{padding:22px 40px 34px}.run{padding:16px 40px 0}}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-ink,var(--muted))}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>h3{font-size:22px}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{color:var(--muted);max-width:38em}

/* chapter opener */
.opener{background:var(--tint);margin:-18px -22px 0;padding:26px 22px 24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-bottom:2px dashed var(--c)}
@media (min-width:640px){.opener{margin:-22px -40px 0;padding:32px 40px 28px}}
.opener h2{font-size:clamp(26px,6.2vw,38px);color:var(--ink)}
.opener h2 mark{background:none;color:var(--c-ink)}
.opener .who{font-size:15px;color:var(--muted);margin-top:8px}
.opener .logo{width:clamp(72px,18vw,110px);aspect-ratio:1;border-radius:18px;background:var(--plate);display:grid;place-items:center;padding:8px;box-shadow:0 2px 0 var(--line)}
.opener .logo img{max-height:100%;object-fit:contain}
.opener .logo.wide{aspect-ratio:auto;width:clamp(120px,30vw,180px);padding:10px}

/* cover */
.cover{padding:34px 22px 30px;display:flex;flex-direction:column;gap:26px}
@media (min-width:640px){.cover{padding:48px 40px 40px}}
.cover h1{font-size:clamp(40px,10vw,64px);line-height:1.1}
.cover h1 span{display:inline-block}
.cover h1 .a{color:var(--taskgo-ink)} .cover h1 .b{color:var(--homigo-ink)} .cover h1 .w{color:var(--washgo-ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);min-width:0}
.trio button:hover,.trio button:focus-visible{border-color:var(--c)}
.trio .pl{background:var(--plate);border-radius:10px;height:64px;display:grid;place-items:center;padding:6px}
.trio .pl img{max-height:52px;object-fit:contain}
.trio b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--c-ink)}
.trio small{font-size:12px;color:var(--muted);line-height:1.4}
.quote{border-left:3px solid var(--ink);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.quote p{font-family:var(--f-display);font-size:clamp(18px,4.4vw,22px);line-height:1.5}
.quote cite{font-style:normal;font-size:13px;color:var(--muted)}
.toc li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.toc li:hover b{text-decoration:underline}
.toc .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.toc .pg{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.toc small{display:block;color:var(--muted);font-size:13px}

/* advantages */
.adv{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.adv{grid-template-columns:1fr 1fr}}
.adv li{padding:14px 16px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;gap:4px;min-width:0}
.adv b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--c-ink)}
.adv p{font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps li{display:flex;flex-direction:column;gap:4px;padding:14px;border:1.5px solid var(--line);border-radius:12px;min-width:0}
.steps .k{font-family:var(--f-mono);font-size:12px;color:var(--c-ink)}
.steps b{font-family:var(--f-display);font-weight:400;font-size:19px}
.steps p{font-size:14px;color:var(--muted)}

/* flow */
.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.flow li{flex:1 0 112px;display:flex;flex-direction:column;gap:2px;padding:10px 12px 10px 10px;position:relative;min-width:112px}
.flow li::before{content:"";position:absolute;left:0;right:0;top:20px;height:2px;background:var(--c)}
.flow li:first-child::before{left:14px} .flow li:last-child::before{right:auto;width:14px}
.flow .dot{width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--paper);font-family:var(--f-mono);font-size:11px;display:grid;place-items:center;position:relative;margin-bottom:6px}
.flow b{font-family:var(--f-display);font-weight:400;font-size:17px}
.flow span{font-size:13px;color:var(--muted);line-height:1.45}
.life{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.life span{padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--ink)}
.life i{font-style:normal;color:var(--muted);font-family:var(--f-mono)}

/* pain images */
.pain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pain figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.pain img{border-radius:12px;aspect-ratio:9/16;object-fit:cover;width:100%;border:1px solid var(--line)}
.pain figcaption{font-size:13px;color:var(--muted)}

/* videos */
.reels{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:-22px;padding-inline:22px}
@media (min-width:640px){.reels{margin-inline:-40px;padding-inline:40px}}
.reel{flex:0 0 min(62vw,220px);scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.reel video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;object-fit:cover;display:block}
.vt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vt b{font-family:var(--f-display);font-weight:400;font-size:17px}
.vt span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.reel p,.wide p{font-size:13px;color:var(--muted);line-height:1.5}
.wide{display:flex;flex-direction:column;gap:8px}
.wide video{width:100%;aspect-ratio:1920/984;border-radius:14px;background:#000;display:block}
.note{font-size:13px;color:var(--muted)}
.catalog{display:flex;flex-direction:column;gap:16px}
.catalog .reel{flex:none;width:100%;display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;scroll-snap-align:none}
.catalog .reel video{width:132px;height:235px;aspect-ratio:auto;object-fit:contain;background:#111}
.catalog .vt{align-items:baseline}
.catalog .reel p{margin:0}
@media (max-width:520px){.catalog .reel{grid-template-columns:108px 1fr;gap:10px}.catalog .reel video{width:108px;height:192px}}

/* feature index */
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 16px}
.idx h4{font-size:16px;color:var(--c-ink);padding-bottom:6px;border-bottom:2px solid var(--c);margin-bottom:6px}
.idx li{font-size:14px;padding:3px 0}
.idx li::before{content:"·";color:var(--c-ink);font-weight:900;margin-right:6px}

/* two col */
.cols{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:600px){.cols{grid-template-columns:1fr 1fr}}
.kv li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:15px}
.kv b{font-weight:700;color:var(--c-ink)}

/* photo + press */
.photo{margin:0;display:flex;flex-direction:column;gap:6px}
.photo img{border-radius:12px;width:100%;border:1px solid var(--line)}
.photo figcaption{font-size:12px;color:var(--muted)}
.stills{display:grid;grid-template-columns:1fr;gap:12px;margin:4px 0 2px}
@media (min-width:720px){.stills.two{grid-template-columns:1fr 1fr;align-items:start}}
.stills figure{margin:0;display:flex;flex-direction:column;gap:6px}
.stills img{width:100%;border-radius:12px;border:1px solid var(--line);background:#111;display:block}
.stills.tall img{max-height:480px;object-fit:contain}
.stills figcaption{font-size:12px;color:var(--muted);line-height:1.45}
.phones{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.phones{grid-template-columns:1fr 1fr 1fr;align-items:start}}
.phones figure{margin:0;display:flex;flex-direction:column;gap:6px}
.phones img{width:100%;height:360px;object-fit:cover;object-position:top center;border-radius:12px;border:1px solid var(--line);background:#F4F6F9}
.phones figcaption{font-size:12px;color:var(--muted);line-height:1.45}
.press{display:grid;grid-template-columns:1fr;gap:14px;padding:16px;border-radius:14px;border:1.5px solid var(--line)}
@media (min-width:600px){.press{grid-template-columns:240px 1fr;align-items:start}}
.press img{border-radius:10px;width:100%}
.press .src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.press h4{font-size:18px;margin:4px 0 8px}
.press li{font-size:14px;padding:2px 0}
.press li::before{content:"— ";color:var(--muted)}
.press blockquote{margin:10px 0 0;padding:10px 12px;background:var(--tint);border-radius:10px;font-size:15px}

/* mascot */
.mascot{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--soft)}
.mascot img{border-radius:50%;width:76px;height:76px;object-fit:cover}
.mascot b{font-family:var(--f-display);font-weight:400;font-size:18px}
.mascot p{font-size:14px;color:var(--muted)}

.offer{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:14px;background:var(--c);color:var(--paper)}
.offer b{font-family:var(--f-display);font-weight:400;font-size:20px}
.offer span{font-size:14px;opacity:.92}
.share{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--c);background:var(--tint)}
.share b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}
.share span{font-size:13px;color:var(--muted)}
.share-actions{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block}
.homigo-pg .offer{color:#1B2440}

/* how to read this book */
.beats{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.beats{grid-template-columns:repeat(3,1fr)}}
.beats li{padding:12px 14px;border-radius:12px;background:var(--soft);min-width:0}
.beats .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--c-ink)}
.beats b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;margin-top:2px}
.beats span{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px}
.jumps{display:flex;gap:8px;flex-wrap:wrap}
.jumps button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}
.jumps button:hover,.jumps button:focus-visible{border-color:var(--c);color:var(--c-ink)}
.roles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.roles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:640px){.roles.four{grid-template-columns:1fr 1fr}}
.roles li{padding:14px;border-radius:12px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.roles .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--c-ink)}
.roles b{font-family:var(--f-display);font-weight:400;font-size:18px}
.roles p{font-size:14px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.lanes{grid-template-columns:repeat(3,1fr)}}
.lanes li{padding:14px 16px;border-radius:12px;background:var(--soft);border-top:4px solid var(--c,var(--brand));display:flex;flex-direction:column;gap:4px;min-width:0}
.lanes .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--c-ink)}
.lanes b{font-family:var(--f-display);font-weight:400;font-size:22px}
.lanes p{font-size:14px;color:var(--muted);line-height:1.5}
.press figure{margin:0;display:flex;flex-direction:column;gap:6px}
.press figcaption{font-size:12px;color:var(--muted)}
.press.stack{grid-template-columns:1fr}
.jump-target{scroll-margin-top:16px}
html{scroll-behavior:smooth}

/* reactions */
.react{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:14px;border:1.5px dashed var(--c)}
.react-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.like{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;transition:transform .15s,border-color .2s}
.like svg{width:20px;height:20px;fill:none;stroke:var(--like);stroke-width:2}
.like[aria-pressed="true"]{border-color:var(--like);color:var(--like)}
.like[aria-pressed="true"] svg{fill:var(--like)}
.like:active{transform:scale(.94)}
.like .cnt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cform{display:flex;flex-direction:column;gap:8px}
.cform textarea{width:100%;min-height:76px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.cform textarea:focus{border-color:var(--c);outline:none}
.cform .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:700;font-size:14px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.clist{display:flex;flex-direction:column;gap:12px}
.c{display:grid;grid-template-columns:32px 1fr;gap:10px;min-width:0}
.c img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.c .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.c .meta b{color:var(--ink)}
.c .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.c .del{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}

<template id="pg-method">

      const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.left="-999px"; document.body.append(ta); ta.select();
      try{ok=document.execCommand("copy");}catch(err){} ta.remove();
    }
    b.textContent=ok?"已複製連結":text;
    setTimeout(()=>b.textContent=label,1600);}));
  page.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{const t=$("#"+b.dataset.copy).textContent;
    try{await navigator.clipboard.writeText(t);b.textContent="已複製";}catch(e){const r=document.createRange();r.selectNodeContents($("#"+b.dataset.copy));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="已選取";}
    setTimeout(()=>b.textContent="複製",1600);}));
  page.querySelectorAll("[data-react]").forEach(box=>buildReact(box,box.dataset.react));
}

function go(i,dir){
  if(i<0||i>=PAGES.length||i===S.i)return;
  const d=dir||(i>S.i?"next":"prev"); S.i=i;
  try{ if(location.hash!=="#"+PAGES[i].id) history.replaceState(null,"","#"+PAGES[i].id); }catch(e){}
  buildNav(); render(d); window.scrollTo({top:0,behavior:"auto"});
}
$("#prev").onclick=()=>go(S.i-1); $("#next").onclick=()=>go(S.i+1);
document.addEventListener("keydown",e=>{ if(e.target.closest("textarea,input,video"))return; if(e.key==="ArrowRight")go(S.i+1); if(e.key==="ArrowLeft")go(S.i-1); });
(()=>{let x0=null,y0=null;const b=$("#book");
  b.addEventListener("touchstart",e=>{ if(e.target.closest(".reels,.catalog,.flow,video,textarea")){x0=null;return;} x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  b.addEventListener("touchend",e=>{ if(x0==null)return; const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6) go(S.i+(dx<0?1:-1)); },{passive:true});})();
window.addEventListener("hashchange",()=>{const i=PAGES.findIndex(p=>"#"+p.id===location.hash); if(i>=0)go(i);});

/* ---------- reactions（呼叫 /api/showcase，Cloudflare Pages Functions + D1） ---------- */
const API="/api/showcase";
S.vid=(()=>{const K="go_showcase_vid";let v=null;
  try{v=localStorage.getItem(K);}catch(e){}
  if(!v||!/^[A-Za-z0-9-]{8,64}$/.test(v)){v=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));try{localStorage.setItem(K,v);}catch(e){}}
  return v;})();
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{"content-type":"application/json",...(opt.headers||{})}});
  let data={}; try{data=await r.json();}catch(e){}
  if(!r.ok){const err=new Error(data.error||("HTTP "+r.status));err.status=r.status;throw err;}
  return data;
}
function buildReact(box,k){
  box.className="react";
  box.append(
    el("div",{class:"react-top"},[
      el("button",{class:"like",type:"button","data-like":k,"aria-pressed":"false",onclick:()=>toggleLike(k),
        html:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg><span>喜歡 '+NAMES[k]+'</span><span class="cnt">0</span>'}),
      el("span",{class:"note","data-likenote":k})]),
    (()=>{const f=el("form",{class:"cform",autocomplete:"on"},[
      el("label",{for:"ctext-"+k,class:"note",text:"對 "+NAMES[k]+" 有興趣？留言問我們：試用、價格、導入時間都可以"}),
      el("textarea",{id:"ctext-"+k,maxlength:"300",placeholder:"例：我們有 20 位師傅，導入要多久？"}),
      el("div",{class:"two"},[
        el("input",{id:"cname-"+k,maxlength:"20",placeholder:"怎麼稱呼你（會公開顯示）","aria-label":"稱呼"}),
        el("input",{id:"ccontact-"+k,maxlength:"80",placeholder:"LINE ID 或電話（選填，不公開）","aria-label":"聯絡方式"})]),
      el("input",{class:"hp",id:"cweb-"+k,tabindex:"-1",autocomplete:"off","aria-hidden":"true",placeholder:"website"}),
      el("div",{class:"row"},[el("span",{class:"note","data-cnote":k}),el("button",{class:"btn",type:"submit","data-csend":k,text:"送出留言"})])]);
      f.addEventListener("submit",e=>{e.preventDefault();sendComment(k);}); return f;})(),
    el("ul",{class:"clist","data-clist":k}));
  try{const n=localStorage.getItem("go_showcase_name"); if(n) document.getElementById("cname-"+k).value=n;}catch(e){}
  renderLikes(); renderComments();
}
const q=(a,k)=>document.querySelector(`[${a}="${k}"]`);
function renderLikes(){ Object.keys(NAMES).forEach(k=>{const b=q("data-like",k); if(!b)return;
  b.querySelector(".cnt").textContent=S.likes[k]||0; b.setAttribute("aria-pressed",String(!!S.mine[k]));});}
async function toggleLike(k){
  const note=q("data-likenote",k);
  if(S.busyLike)return; S.busyLike=true;
  const was=!!S.mine[k]; S.mine[k]=!was; S.likes[k]=Math.max(0,(S.likes[k]||0)+(was?-1:1)); renderLikes();
  try{const d=await api("/like",{method:"POST",body:JSON.stringify({vid:S.vid,product:k})}); S.likes=d.likes; S.mine=d.mine; renderLikes(); note.textContent=S.mine[k]?"謝謝你的讚！":"";}
  catch(e){ S.mine[k]=was; S.likes[k]=Math.max(0,(S.likes[k]||0)+(was?1:-1)); renderLikes(); note.textContent="按讚沒有成功，請稍後再試"; }
  S.busyLike=false;
}
function fmt(iso){try{return new Date(iso).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}
function renderComments(){ Object.keys(NAMES).forEach(k=>{const ul=q("data-clist",k); if(!ul)return; ul.innerHTML="";
  const list=S.comments.filter(c=>c.product===k);
  if(!list.length){ul.append(el("li",{class:"empty",text:S.api===false?"互動功能需部署到 GO 行銷中心後啟用":"還沒有留言，第一個說說你的想法吧"}));return;}
  list.forEach(c=>{
    const meta=el("div",{class:"meta"},[el("b",{text:c.name||"訪客"}),el("span",{text:fmt(c.at)})]);
    if(c.mine)meta.append(el("button",{class:"del",type:"button",text:"刪除",onclick:()=>delComment(c.id)}));
    const av=el("span",{"aria-hidden":"true",style:"width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--c-ink);display:grid;place-items:center;font-weight:700;font-size:14px",text:(c.name||"訪").slice(0,1)});
    ul.append(el("li",{class:"c"},[av,el("div",{},[meta,el("p",{class:"txt",text:c.text})])]));});});}
async function sendComment(k){
  const ta=document.getElementById("ctext-"+k),note=q("data-cnote",k),btn=q("data-csend",k),text=ta.value.trim();
  const name=document.getElementById("cname-"+k).value.trim(),contact=document.getElementById("ccontact-"+k).value.trim(),website=document.getElementById("cweb-"+k).value;
  if(!text){note.textContent="請先輸入留言內容";return;}
  if(S.busyCmt)return; S.busyCmt=true; btn.disabled=true; note.textContent="送出中…";
  try{const d=await api("/comment",{method:"POST",body:JSON.stringify({vid:S.vid,product:k,name,contact,text,website})});
    if(d.comments)S.comments=d.comments; ta.value=""; document.getElementById("ccontact-"+k).value="";
    try{if(name)localStorage.setItem("go_showcase_name",name);}catch(e){}
    renderComments(); note.textContent=contact?"已送出，我們會用你留的方式聯絡你":"已送出，謝謝你的留言";}
  catch(e){note.textContent=e.status===429?e.message:(e.message||"送出失敗，請稍後再試");}
  S.busyCmt=false; btn.disabled=false;
}
async function delComment(id){
  try{const d=await api("/comment/"+id,{method:"DELETE",body:JSON.stringify({vid:S.vid})}); if(d.comments)S.comments=d.comments; renderComments();}catch(e){}
}
async function load(){
  try{const d=await api("/state?vid="+encodeURIComponent(S.vid)); S.api=true; S.likes=d.likes; S.mine=d.mine; S.comments=d.comments||[]; renderLikes(); renderComments();}
  catch(e){ if(S.api===null){S.api=false; renderComments();} }
}

/* ---------- boot ---------- */
(function(){const i=PAGES.findIndex(p=>"#"+p.id===location.hash); if(i>=0)S.i=i;})();
buildNav(); render(); load();
setInterval(()=>{ if(document.visibilityState==="visible"&&S.api) load(); },30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.api) load(); });
</script>

</body>

# 排程 Worker:市場情報自動蒐集 + Threads 趨勢草稿 + 媒體清理
# 部署:cd workers/scheduler && wrangler deploy
# secrets:wrangler secret put DATABASE_URL / OPENAI_API_KEY
name = "go-marketing-scheduler"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[triggers]
# 每 3 小時第 15 分:蒐集熱門議題 → AI 篩選寫入 market_signals;同時回收近 28 天貼文 Insights 並產生成效學習建議
# 每小時第 45 分:為一則高分情報生成三平台草稿(拆開避免超過子請求上限)
# 每 30 分鐘統一調度(halfHourlyDispatch,生成與發布已拆開):
#   - 整點 tick:提前 1 小時生成下個時段的內容,存成 scheduled 排程(Threads 品牌相關 00/06/12/18、
#     Threads 生活哏文 09/21(Homigo+Washgo+TaskGo)、FB+IG 每日主題 19(已接帳號的品牌各 1 篇),皆為台灣時間)→ 行程表可提早看到已排定的內容
#   - 每個 tick 另補漏檔:已產出卻沒 job 的自動建單;今日已到點但缺的 Threads/FB/IG 每 tick 最多補 1 則
#     (免費方案子請求有上限,避免單一 tick 產圖逾時後整天只發出 1 個品牌)
#   - 每個 tick(整點+半點)都會呼叫 publishDueJobs,檢查有沒有到期的排程要真正發布
#     (發布時間誤差在 30 分鐘內;Cloudflare 帳號 Cron Trigger 數量有上限,沒有另開更密集的 cron)
#   - 半點 tick 另外跑 Threads 自動回覆(偶數小時);台灣凌晨 2-6 點靜默不跑回覆
# 每天 18:30 UTC(台灣 02:30):清理超過 31 天的 R2 生成圖片
# 每週一、四 23:00 UTC(台灣週二、五 07:00):生成 Podcast 逐字稿(語音由人工在後台觸發)
crons = ["15 */3 * * *", "45 * * * *", "*/30 * * * *", "30 18 * * *", "0 23 * * 1,4"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "go-marketing-media"

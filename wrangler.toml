name = "go-marketing-center"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"
# Pages 不支援 wrangler [observability]；請在 Dashboard → Workers & Pages → 專案 → Settings 開 Logs

# ADMIN_USERNAME / ADMIN_PASSWORD / FIXERCOWORK_USERNAME / FIXERCOWORK_PASSWORD
# / DATABASE_URL / OPENAI_API_KEY / LINE_NETWORK_CHANNEL_SECRET
# / LINE_NETWORK_CHANNEL_ACCESS_TOKEN / LINE_OPS_CHANNEL_SECRET
# / LINE_OPS_CHANNEL_ACCESS_TOKEN / ELEVENLABS_API_KEY
# / HOMIGO_INGEST_KEY / TASKGO_INGEST_KEY / WASHGO_INGEST_KEY
# / LINE_NETWORK_CHANNEL_ACCESS_TOKEN / ELEVENLABS_API_KEY
# / ELEVENLABS_WASHGO_AGENT_ID / ELEVENLABS_HOMIGO_AGENT_ID
# / ELEVENLABS_TASKGO_AGENT_ID / ELEVENLABS_TOOL_SECRET / CESIUM_ION_TOKEN 皆以 secret 管理
# 本機開發請在 .env 或 .dev.vars 設定,正式環境請用 `wrangler pages secret put`
# LINE_NETWORK_BRAND_SLUG 預設 fixercowork

# AI 生成圖片存放的 R2 bucket
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "go-marketing-media"

[[kv_namespaces]]
binding = "CACHE"
id = "0571f06408cb41fa849c1df9b5cb3066"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "286329edb5f24551b6684450d1eac8f8"

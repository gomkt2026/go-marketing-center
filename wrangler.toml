name = "go-marketing-center"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ADMIN_USERNAME / ADMIN_PASSWORD / FIXERCOWORK_USERNAME / FIXERCOWORK_PASSWORD
# / DATABASE_URL / OPENAI_API_KEY 皆以 secret 管理
# 本機開發請在 .env 設定,正式環境請用 `wrangler pages secret put`

# AI 生成圖片存放的 R2 bucket
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "go-marketing-media"
